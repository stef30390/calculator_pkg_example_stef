[tox]
minversion = 3.11.0
envlist = python3.11, python3.12, python3.13, python3.14, ruff, mypy
isolated_build = True

[gh-actions]
python =
    3.11: python3.11, ruff, mypy
    3.12: python3.12
    3.13: python3.13
    3.14: python3.14


[testenv]
deps =
    pytest
commands = pytest tests --basetemp={envtmpdir}

[testenv:mypy]
deps = -r {toxinidir}/requirements_dev.txt
commands = mypy calculator_pkg_example_stef

[testenv:ruff]
deps = ruff
commands =
    ruff check calculator_pkg_example_stef
    ruff format --check calculator_pkg_example_stef