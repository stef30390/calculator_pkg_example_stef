[tox]
minversion = 3.11.0
envlist = pypy3, python3.10, python3.11, python3.12, python3.13, python3.14, ruff, mypy
isolated_build = True

[gh-actions]
python =
    3.11: python3.11, ruff, mypy
    #3.12: python3.12
    #3.13: python3.13
    #3.14: python3.14


[testenv]
deps =
    pytest
commands = pytest calculator_pkg_example_stef --basetemp={envtmpdir}

[testenv:mypy]
basepython = python3.11
deps = -r {toxinidir}/requirements_dev.txt
commands = mypy calculator_pkg_example_stef

[testenv:ruff]
basepython = python3.11
deps = ruff
commands =
    ruff check calculator_pkg_example_stef
    ruff format calculator_pkg_example_stef