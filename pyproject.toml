[build-system]
requires =["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "calculator_pkg_example_stef"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "tqdm ~= 4.0" 
]


[project.scripts]
calculator_pkg_example_stef = "calculator_pkg_example_stef.__main__:main"

[project.optional-dependencies]
test = [
    "pytest == 9.0.2",
    "mypy==1.19.1",
    "types-tqdm",
    "ruff==0.17.3",
    "pre-commit==4.7.0",
    "tox== 4.67.4"
    ]